name: Upstream Sync

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync & Detect New Tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add tailscale upstream remote
        run: |
          git remote add tailscale https://github.com/tailscale/tailscale.git
          git fetch tailscale --tags --no-recurse-submodules

      - name: Ensure upstream branch exists
        run: |
          if git ls-remote --exit-code origin upstream; then
            echo "Branch 'upstream' already exists."
            git fetch origin upstream
            git checkout upstream
          else
            echo "Creating 'upstream' branch from tailscale/main..."
            git checkout -b upstream tailscale/main
          fi

      - name: Sync upstream branch (strip tailscale workflows)
        run: |
          git checkout upstream
          git reset --hard tailscale/main

          # Remove tailscale's own .github/ — we don't need their workflows,
          # and GitHub blocks pushing foreign workflow files without 'workflows' permission
          if [ -d ".github" ]; then
            git rm -rf .github/ --quiet
            git commit -m "chore: remove upstream .github/ [skip ci]" || true
          fi

          git push origin upstream --force

      - name: Detect new tags
        id: detect
        run: |
          git checkout main

          # All upstream version tags, sorted oldest→newest
          UPSTREAM_TAGS=$(git tag --list 'v*.*.*' --sort=version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          echo "All upstream tags:"
          echo "$UPSTREAM_TAGS"

          # Read already-built tags from ledger
          BUILT_TAGS=$(cat built-tags.txt 2>/dev/null || echo "")

          NEW_TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if ! echo "$BUILT_TAGS" | grep -qx "$tag"; then
              NEW_TAGS="$NEW_TAGS $tag"
            fi
          done <<< "$UPSTREAM_TAGS"

          NEW_TAGS=$(echo "$NEW_TAGS" | xargs)  # trim whitespace

          if [ -z "$NEW_TAGS" ]; then
            echo "No new tags. Nothing to build."
            echo "new_tags=" >> $GITHUB_OUTPUT
          else
            echo "New tags detected: $NEW_TAGS"
            echo "new_tags=$NEW_TAGS" >> $GITHUB_OUTPUT
          fi

      - name: Record new tags & push them to trigger builds
        if: steps.detect.outputs.new_tags != ''
        run: |
          git checkout main

          # Record all new tags in the ledger first
          for tag in ${{ steps.detect.outputs.new_tags }}; do
            echo "$tag" >> built-tags.txt
          done

          sort -V built-tags.txt | uniq > built-tags.tmp
          mv built-tags.tmp built-tags.txt

          git add built-tags.txt
          git commit -m "chore: record newly built tags [skip ci]"
          git push origin main

          # Trigger container-build.yml via workflow_dispatch API using PAT.
          # Neither GITHUB_TOKEN nor PAT tag pushes can trigger other workflows
          # from within Actions — this is a confirmed GitHub limitation.
          # workflow_dispatch via PAT is the only reliable solution.
          for tag in ${{ steps.detect.outputs.new_tags }}; do
            echo "Triggering container build for: $tag"
            PAYLOAD=$(printf '{"ref":"main","inputs":{"tag":"%s"}}' "$tag")
            HTTP_STATUS=$(curl -s -o /tmp/curl_response.json -w "%{http_code}"               -X POST               -H "Authorization: token ${{ secrets.PAT_TOKEN }}"               -H "Accept: application/vnd.github.v3+json"               -H "Content-Type: application/json"               -d "$PAYLOAD"               https://api.github.com/repos/${{ github.repository }}/actions/workflows/container-build.yml/dispatches)
            echo "HTTP status: $HTTP_STATUS"
            cat /tmp/curl_response.json
            sleep 2
          done
