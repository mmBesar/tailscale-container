name: Container Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.98.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Build Info
    runs-on: ubuntu-latest
    outputs:
      version:   ${{ steps.info.outputs.version }}
      is_stable: ${{ steps.info.outputs.is_stable }}
      image:     ${{ steps.info.outputs.image }}

    steps:
      - name: Resolve version & tags
        id: info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Lowercase image name — GHCR requirement
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # Even minor = stable, odd minor = unstable (mirrors Tailscale's own convention)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if (( MINOR % 2 == 0 )); then
            IS_STABLE=true
          else
            IS_STABLE=false
          fi

          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT
          echo "image=$IMAGE"         >> $GITHUB_OUTPUT

          echo "### 🔍 Build Info"           >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"             >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"             >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Stable  | $IS_STABLE |"   >> $GITHUB_STEP_SUMMARY
          echo "| Image   | \`$IMAGE\` |"   >> $GITHUB_STEP_SUMMARY

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-latest   # QEMU only for riscv64

    steps:
      - name: Checkout repo at tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 1

      - name: Set up QEMU (riscv64 only)
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Push Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_STABLE="${{ needs.prepare.outputs.is_stable }}"

          TAGS="-t ${IMAGE}:${VERSION}"

          if [ "$IS_STABLE" = "true" ]; then
            TAGS="$TAGS -t ${IMAGE}:stable -t ${IMAGE}:latest"
          else
            TAGS="$TAGS -t ${IMAGE}:unstable"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.tags }} \
            $(printf '${{ needs.prepare.outputs.image }}@sha256:%s ' $(ls /tmp/digests))

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}

      - name: Summary
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_STABLE="${{ needs.prepare.outputs.is_stable }}"

          echo "### ✅ Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | |"               >> $GITHUB_STEP_SUMMARY
          echo "|-----|-|"               >> $GITHUB_STEP_SUMMARY
          echo "| \`${IMAGE}:${VERSION}\` | pinned |" >> $GITHUB_STEP_SUMMARY

          if [ "$IS_STABLE" = "true" ]; then
            echo "| \`${IMAGE}:stable\` | floating |" >> $GITHUB_STEP_SUMMARY
            echo "| \`${IMAGE}:latest\` | floating |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`${IMAGE}:unstable\` | floating |" >> $GITHUB_STEP_SUMMARY
          fi
